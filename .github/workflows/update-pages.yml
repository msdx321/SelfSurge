name: Validate, update catalog and publish Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Validate checked-in files offline
        run: uv run --no-project python -m unittest discover -s tests -v

  update-and-deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Set up uv
        if: github.event_name != 'push'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Update generated files
        if: github.event_name != 'push'
        run: uv run --no-project python generate.py

      - name: Check live upstream compatibility
        if: github.event_name != 'push'
        env:
          SELFSURGE_LIVE_TESTS: "1"
        run: uv run --no-project python -m unittest discover -s tests -v

      - name: Commit updates
        if: github.event_name != 'push'
        run: |
          git add modules scripts resources sources.json web/catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update Hub catalog"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
