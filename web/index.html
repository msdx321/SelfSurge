<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>SelfSurge 模块</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(1040px, calc(100% - 32px)); margin: 48px auto; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.04em; }
      .intro { margin: 10px 0 28px; color: #667085; }
      .exclusions { margin: 16px 0; padding: 14px; border: 1px solid #98a2b3; border-radius: 10px; }
      .exclusions p { margin: 0 0 10px; font-size: .85rem; }
      .exclusions input { width: 100%; margin-bottom: 8px; }
      .exclusions .actions { margin-bottom: 10px; }
      button:disabled { opacity: .55; cursor: wait; }
      .exclude-app { display: flex; align-items: center; gap: 6px; margin: 0 0 12px; font-size: .8rem; }
      .exclude-app[hidden] { display: none; }
      .exclude-app input { width: auto; margin: 0; padding: 0; flex: none; }
      .toolbar { position: sticky; top: 0; z-index: 1; padding: 12px 0; background: #f5f7fbe8; backdrop-filter: blur(10px); }
      label { display: block; font-size: .875rem; font-weight: 650; }
      input {
        width: 100%; margin-top: 8px; padding: 13px 15px; border: 1px solid #d0d5dd;
        border-radius: 12px; background: #fff; color: inherit; font: inherit;
      }
      input:focus { outline: 3px solid #a9c7ff; border-color: #2970ff; }
      #status { min-height: 24px; margin: 12px 0; color: #667085; font-size: .875rem; }
      #modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
      article {
        display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 18px;
        border: 1px solid #e4e7ec; border-radius: 16px; background: #fff;
        box-shadow: 0 2px 8px #1018280a;
      }
      article img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: #eef2f6; }
      article h2 { margin: 1px 0 5px; font-size: 1rem; }
      .description {
        display: -webkit-box; min-height: 42px; margin: 0; overflow: hidden;
        color: #667085; font-size: .875rem; line-height: 1.5;
        -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      }
      .meta { margin: 10px 0 13px; color: #98a2b3; font-size: .75rem; }
      .warnings { margin: 0 0 13px; padding: 10px 10px 10px 26px; border-radius: 9px; background: #fffaeb; color: #93370d; font-size: .8rem; line-height: 1.5; }
      .warnings li + li { margin-top: 6px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .actions a, .actions button, .exclusions button {
        padding: 8px 10px; border: 1px solid #d0d5dd; border-radius: 9px;
        background: #fff; color: #344054; font: inherit; font-size: .8rem;
        line-height: 1; text-decoration: none; cursor: pointer;
      }
      .actions .install { border-color: #175cd3; background: #175cd3; color: #fff; }
      .actions a:hover, .actions button:hover, .exclusions button:hover { filter: brightness(.96); }
      .empty { grid-column: 1 / -1; padding: 50px 0; text-align: center; color: #667085; }

      @media (prefers-color-scheme: dark) {
        :root { color: #f2f4f7; background: #101828; }
        .toolbar { background: #101828e8; }
        input, article, .actions a, .actions button, .exclusions button { border-color: #344054; background: #1d2939; color: #f2f4f7; }
        .intro, #status, .description, .empty { color: #98a2b3; }
        .actions .install { border-color: #528bff; background: #2970ff; }
        .warnings { background: #432b14; color: #fedf89; }
      }

      @media (max-width: 520px) {
        main { width: min(100% - 24px, 1040px); margin-top: 28px; }
        #modules { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SelfSurge</h1>
      <p class="intro">通用去广告提供完整基础覆盖，可与单独应用模块搭配使用。勾选你已启用的应用，并将排除参数填入通用模块，保留其他应用的兜底规则。来源：Kelee、fmz200、ddgksf2013。</p>
      <div class="exclusions">
        <div class="actions">
          <button id="read-surge-status" type="button" disabled>读取 Surge 状态</button>
          <a href="surge:///install-module?url=https%3A%2F%2Fraw.githubusercontent.com%2Fmsdx321%2FSelfSurge%2Fmain%2Fweb%2FSelfSurge_Status.sgmodule">安装状态助手</a>
        </div>
        <p id="surge-status" role="status">首次读取请安装并启用状态助手，开启脚本和 HTTPS 解密，并信任 Surge CA 证书。状态在本机读取。</p>
        <p>读取状态可勾选匹配的已启用应用，也可手动勾选。核对后复制参数，填入通用模块的 <code>exclude_apps</code>；<code>none</code> 表示不排除，保留全部通用规则。</p>
        <label for="exclude-apps">已启用应用的排除参数</label>
        <input id="exclude-apps" type="text" readonly value="none">
        <button id="copy-exclusions" type="button">复制排除参数</button>
      </div>
      <div class="toolbar">
        <label for="search">搜索模块</label>
        <input id="search" type="search" placeholder="名称、分类、来源或说明" autocomplete="off">
      </div>
      <p id="status" role="status">正在加载模块…</p>
      <section id="modules" aria-label="模块列表"></section>
    </main>

    <template id="module-card">
      <article>
        <img alt="" loading="lazy">
        <div>
          <h2></h2>
          <p class="description"></p>
          <p class="meta"></p>
          <label class="exclude-app" hidden><input type="checkbox">已启用此应用模块：从通用规则中排除</label>
          <ul class="warnings" aria-label="使用注意事项" hidden></ul>
          <div class="actions">
            <a class="install">导入 Surge</a>
            <a class="view" target="_blank" rel="noreferrer">查看模块</a>
            <button type="button">复制链接</button>
          </div>
        </div>
      </article>
    </template>

    <script>
      const search = document.querySelector("#search");
      const status = document.querySelector("#status");
      const modules = document.querySelector("#modules");
      const template = document.querySelector("#module-card");
      const excludeApps = document.querySelector("#exclude-apps");
      const copyExclusions = document.querySelector("#copy-exclusions");
      const readSurgeStatus = document.querySelector("#read-surge-status");
      const surgeStatus = document.querySelector("#surge-status");
      const excluded = new Set();
      let catalog = [];
      let surgeEnabled = null;
      let surgeAvailable = null;

      function updateExclusions() {
        excludeApps.value = [...excluded].sort().join("|") || "none";
        copyExclusions.textContent = "复制排除参数";
      }

      readSurgeStatus.addEventListener("click", async () => {
        readSurgeStatus.disabled = true;
        surgeStatus.textContent = "正在读取本机 Surge 模块状态…";
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch("./surge-status", {
            cache: "no-store", credentials: "omit", signal: controller.signal,
          });
          if (!response.ok) throw new Error("Status helper unavailable");
          const data = await response.json();
          if (data.bridge !== "SelfSurge" || ![data.enabled, data.available].every(
            (names) => Array.isArray(names) && names.every((name) => typeof name === "string")
          )) throw new Error("Invalid module status");

          // Surge returns module names. Do not guess when a name is ambiguous.
          const identities = new Map();
          for (const item of catalog) {
            for (const name of new Set([item.name, item.file, item.file.replace(/\.sgmodule$/, ""), item.url])) {
              if (!identities.has(name)) identities.set(name, new Set());
              identities.get(name).add(item.file);
            }
          }
          const matchNames = (names) => new Set(names.flatMap((name) => {
            const matches = identities.get(name);
            return matches?.size === 1 ? [...matches] : [];
          }));
          surgeEnabled = matchNames(data.enabled);
          surgeAvailable = matchNames(data.available);
          excluded.clear();
          for (const item of catalog) {
            if (surgeEnabled.has(item.file) && item.general_exclusion_key) {
              excluded.add(item.general_exclusion_key);
            }
          }
          updateExclusions();
          render();
          surgeStatus.textContent = `已匹配 ${surgeEnabled.size} 个已启用模块，勾选 ${excluded.size} 个通用规则排除项。按名称匹配，重命名或同名模块请手动核对；更改 Surge 后请重新读取。`;
        } catch {
          surgeStatus.textContent = "读取失败，原有勾选已保留。请确认本机正在运行 Surge、状态助手已启用，且脚本和 HTTPS 解密已开启、证书已信任。";
        } finally {
          clearTimeout(timer);
          readSurgeStatus.disabled = false;
        }
      });

      copyExclusions.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(excludeApps.value);
          copyExclusions.textContent = "已复制，请填入通用模块的 exclude_apps";
        } catch {
          copyExclusions.textContent = "复制失败，请手动复制参数";
        }
      });

      function render() {
        const query = search.value.trim().toLocaleLowerCase();
        const visible = catalog.filter((item) =>
          [item.name, item.category, item.description, item.file, item.upstream]
            .join(" ").toLocaleLowerCase().includes(query)
        );
        const fragment = document.createDocumentFragment();

        for (const item of visible) {
          const card = template.content.cloneNode(true);
          const image = card.querySelector("img");
          image.src = item.icon || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E";
          card.querySelector("h2").textContent = item.name;
          card.querySelector(".description").textContent = item.description || "暂无说明";
          const enabledStatus = surgeEnabled?.has(item.file) ? "Surge 已启用"
            : surgeAvailable?.has(item.file) ? "Surge 未启用" : "";
          card.querySelector(".meta").textContent = [item.kind === "general" ? "通用模块" : item.category, item.upstream, item.date, enabledStatus].filter(Boolean).join(" · ");
          const exclusion = card.querySelector(".exclude-app");
          exclusion.hidden = !item.general_exclusion_key;
          const checkbox = exclusion.querySelector("input");
          checkbox.checked = excluded.has(item.general_exclusion_key);
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) excluded.add(item.general_exclusion_key);
            else excluded.delete(item.general_exclusion_key);
            updateExclusions();
          });
          const warnings = card.querySelector(".warnings");
          for (const message of item.warnings || []) {
            const warning = document.createElement("li");
            warning.textContent = message;
            warnings.append(warning);
          }
          warnings.hidden = !warnings.children.length;
          const install = card.querySelector(".install");
          install.href = `surge:///install-module?url=${encodeURIComponent(item.url)}`;
          card.querySelector(".view").href = item.url;
          card.querySelector(".actions button").addEventListener("click", async (event) => {
            const button = event.currentTarget;
            try {
              await navigator.clipboard.writeText(item.url);
              button.textContent = "已复制";
            } catch {
              button.textContent = "复制失败";
            }
          });
          fragment.append(card);
        }

        modules.replaceChildren(fragment);
        status.textContent = `显示 ${visible.length} / ${catalog.length} 个模块`;
        if (!visible.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "没有匹配的模块";
          modules.append(empty);
        }
      }

      search.addEventListener("input", render);
      fetch("./catalog.json")
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((items) => { catalog = items; render(); readSurgeStatus.disabled = false; })
        .catch(() => { status.textContent = "模块目录加载失败，请稍后重试。"; });
    </script>
  </body>
</html>
